name: StunduSaraksts
options:
  bundleIdPrefix: com.toms
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  StunduSaraksts:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [StunduSaraksts, Shared]
    dependencies:
      - target: StunduWidget
        embed: true
    info:
      path: StunduSaraksts/Info.plist
      properties:
        CFBundleDisplayName: Stundu Saraksts
        CFBundleShortVersionString: "1.3"
        CFBundleVersion: "14"
        UILaunchScreen: {}
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.toms.stundusaraksts.changes
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toms.stundusaraksts
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

  StunduWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [StunduWidget, Shared]
    info:
      path: StunduWidget/Info.plist
      properties:
        CFBundleDisplayName: Stundu Saraksts
        CFBundleShortVersionString: "1.3"
        CFBundleVersion: "14"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toms.stundusaraksts.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  StunduSarakstsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources: [UITests]
    dependencies:
      - target: StunduSaraksts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toms.stundusaraksts.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  StunduSaraksts:
    build:
      targets:
        StunduSaraksts: all
    test:
      targets:
        - StunduSarakstsUITests
