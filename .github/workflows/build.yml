name: Build IPA
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test timetable parser
        run: swift test

      - name: Generate Xcode project
        run: xcodegen generate

      - name: UI tests (simulator, sample data)
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS" in k), key=lambda k: [int(p) for p in k.split("iOS-")[1].split("-")])
          print(next(d["udid"] for k in reversed(ios) for d in devices[k] if d["name"].startswith("iPhone")))
          ')
          echo "Simulator: $UDID"
          xcodebuild test \
            -project StunduSaraksts.xcodeproj \
            -scheme StunduSaraksts \
            -destination "id=$UDID" \
            -derivedDataPath build-tests \
            -resultBundlePath UITestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "Test Case|error:|failed|passed|AUDIT:|\*\* TEST" 

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: UITestResults
          path: UITestResults.xcresult

      - name: Build (unsigned)
        run: |
          xcodebuild -project StunduSaraksts.xcodeproj \
            -scheme StunduSaraksts \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/StunduSaraksts.app Payload/
          zip -r StunduSaraksts.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: StunduSaraksts-ipa
          path: StunduSaraksts.ipa

      # Artifacts always download as a zip; a release asset stays a plain .ipa.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 CFBundleShortVersionString project.yml | cut -d'"' -f2)
          gh release create "build-$GITHUB_RUN_NUMBER" StunduSaraksts.ipa \
            --target "$GITHUB_SHA" \
            --title "Stundu Saraksts $version (build $GITHUB_RUN_NUMBER)" \
            --notes "Instalē ar AltStore un saglabā App Extensions."
